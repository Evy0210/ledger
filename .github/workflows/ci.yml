name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Compile
        run: python -m compileall -q backend
      - name: Demo-mode smoke test
        working-directory: backend
        env:
          DEMO_MODE: "1"
          ADMIN_TOKEN: guest
          DATA_ROOT: ${{ runner.temp }}/ledger-data
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import app
          c = TestClient(app.app)
          h = {"Authorization": "Bearer guest"}
          assert c.get("/api/health").json()["ok"]
          for path in ("/api/status", "/api/summary", "/api/months", "/api/split", "/api/pantry", "/api/settings"):
              r = c.get(path, headers=h)
              assert r.status_code == 200, (path, r.status_code, r.text[:200])
          assert c.get("/api/months", headers=h).json()["months"], "demo data missing"
          assert c.post("/api/expenses", headers=h, json={"amount": 1}).status_code == 403, "demo must be read-only"
          assert c.get("/api/status").status_code == 401, "auth required"
          print("demo smoke test ok")
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

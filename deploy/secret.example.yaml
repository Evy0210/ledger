# cp secret.example.yaml secret.yaml, fill real values, then:
#   kubectl apply -f deploy/secret.yaml
# secret.yaml is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: ledger-secrets
  namespace: ledger
type: Opaque
stringData:
  # 网站密码（也是 Telegram 绑定用的口令）。
  ADMIN_TOKEN: "change-me"
  # 智谱 bigmodel key：小票识别（视觉）+ 一句话记账分类（文本）。
  VISION_API_KEY: ""
  VISION_MODEL: "glm-4.6v"          # 免费档可换 glm-4.6v-flash
  TEXT_MODEL: "glm-4.5-air"
  # @BotFather 建 bot 拿到的 token。chat_id 留空，之后把网站密码发给 bot 自动绑定。
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""
  # 邮件账单：专用邮箱的 IMAP。Gmail 要开两步验证后生成 App Password（16 位）。
  # 用自己主邮箱的话 MAIL_FOLDER 填 Gmail label 名（比如 ledger），并设过滤规则打 label。
  MAIL_IMAP_HOST: "imap.gmail.com"
  MAIL_USER: ""
  MAIL_PASSWORD: ""
  MAIL_FOLDER: "INBOX"

  # Cloudflare Email Worker 推送邮件时带的 Bearer（和网站密码分开）
  MAIL_INBOUND_SECRET: ""

  # 合租分账表（Google Sheet）双向同步。留空 = 关掉。
  # 1) 在自己 Google 账号下建个 GCP 项目，开 sheets.googleapis.com
  # 2) 建服务账号 + JSON 密钥，把整段 JSON 贴进 SHEETS_SA_JSON
  # 3) 在 Google Sheets 里把服务账号邮箱加成「编辑者」
  # SHEETS_PEOPLE 的顺序必须和「明细」表 E/F/G 三列的表头一致。
  SHEETS_ID: ""
  SHEETS_SA_JSON: ""
  SHEETS_ME: "Me"
  SHEETS_PEOPLE: "Alice,Me,Bob"
  SHEETS_SYNC_MINUTES: "10"
